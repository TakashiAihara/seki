name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      # The workflow pins Bun on its own; a .mise.toml bump that forgets it
      # would test with one Bun and develop with another.
      - name: bun version matches .mise.toml
        run: grep -qx 'bun = "1.4.0"' .mise.toml

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
